[project]
name = "unified-mcp-server"
version = "0.2.0"
description = "Self-contained MCP server with file-editing, git, code-analysis, linting and shell-execution tools"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT AND Apache-2.0" }
license-files = ["LICENSE-MIT", "LICENSE-APACHE", "NOTICE"]
keywords = ["mcp", "file-editor", "shell", "llm", "claude"]
dependencies = [
    # fastmcp 4.x removed fastmcp.server.tasks (TaskConfig), used by the tools.
    "fastmcp[tasks]>=3.0.0,<4",
    "mcp>=1.1.0",
    "pydantic>=2.0.0",
    "toml>=0.10.0",
    "asyncssh>=2.14.0",
    "diff-match-patch>=0.0.1",
    "tree-sitter>=0.23.0",
    "tree-sitter-c>=0.23.0",
    "tree-sitter-cpp>=0.23.0",
    "tree-sitter-rust>=0.23.0",
    "tree-sitter-c-sharp>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
]

[[project.authors]]
name = "waxz1992"

[project.scripts]
unified-mcp-server = "unified_mcp_server:main"

[project.optional-dependencies]
linting = ["ruff>=0.1.0", "mypy>=1.0.0", "pylint>=2.17.0", "flake8>=6.0.0", "pyright>=1.1.300"]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unified_mcp_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
