name: unified-mcp-tools

# Calls every MCP tool of the unified server (file + shell) through a real
# MCP client: in-memory, over the stdio console script, and over HTTP with auth.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: tools (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - name: Install system tools used by the shell/git tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q tmux git

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          activate-environment: true
          enable-cache: true

      # mcp-file-edit comes from this checkout (path source); shell-mcp-server
      # from GitHub (see unified-mcp-server/pyproject.toml [tool.uv.sources]).
      - name: Install unified server
        run: uv pip install -e "unified-mcp-server[dev]"

      - name: Show versions
        run: |
          python --version
          python -c "import fastmcp; print('fastmcp', fastmcp.__version__)"
          uv pip list | grep -Ei "mcp|fastmcp|ruff"

      - name: Run MCP tool tests
        working-directory: unified-mcp-server
        run: >
          python -m pytest -v -ra
          --junitxml=../test-results-py${{ matrix.python-version }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-mcp-tools-py${{ matrix.python-version }}
          path: test-results-py${{ matrix.python-version }}.xml
