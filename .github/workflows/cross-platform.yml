name: cross-platform

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:


jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Windows runners default Python stdio to the console codepage (cp1252),
      # which can't encode the emoji ("❌", "✅", ...) in tool/report output.
      # test.py reconfigures its own stdio, but this also covers every other
      # step (like "Show test report" below) that prints such content.
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Automatically creates and adds .venv to PATH
          activate-environment: true
          enable-cache: true

      - name: Install project
        run: |
          uv pip install  .

      - name: Run MCP direct test runner
        run: python test.py --report report-${{ matrix.os }}.txt

      - name: Show test report
        if: always()
        run: python -c "print(open('report-${{ matrix.os }}.txt', encoding='utf-8').read())"

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: report-${{ matrix.os }}
          path: report-${{ matrix.os }}.txt
