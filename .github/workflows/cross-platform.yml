name: cross-platform

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:


jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install project
        run: |
          uv pip install -e .

      - name: Run MCP direct test runner
        run: python test.py --mode direct --max-duration 90 --call-timeout 1.5 --output report.txt
